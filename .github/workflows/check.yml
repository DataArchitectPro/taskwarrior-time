name: Check

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: validate + qmllint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v5

      - name: Install jq + qmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y jq qt6-declarative-dev

      - name: Checkout Omarchy shell (qmllint import path)
        uses: actions/checkout@v5
        with:
          repository: basecamp/omarchy
          path: .ci/omarchy
          sparse-checkout: |
            shell
          sparse-checkout-cone-mode: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run checks
        env:
          OMARCHY_PATH: ${{ github.workspace }}/.ci/omarchy
        run: |
          chmod +x scripts/check scripts/validate-plugin
          ./scripts/check
